<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>html{background:#fafafa}</style>
    <script>
      ;(function () {
        try {
          var scheme = localStorage.getItem('lumina-color-scheme') || 'dark';
          if (scheme === 'system') {
            scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.colorScheme = scheme;
          document.documentElement.style.backgroundColor = scheme === 'dark' ? '#080808' : '#fafafa';
          var meta = document.querySelector("meta[name='theme-color']");
          if (!meta) {
            meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            document.head.appendChild(meta);
          }
          meta.setAttribute('content', scheme === 'dark' ? '#080808' : '#fafafa');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23090a0f'/%3E%3Cpath d='M16 4.5 27.5 16 16 27.5 4.5 16Z' fill='none' stroke='%2338bdf8' stroke-width='2.6'/%3E%3C/svg%3E" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws:; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>Lumina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
